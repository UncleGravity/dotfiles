name: "CI"
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Cancel stale PR validation without interrupting active main builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  flake-check:
    runs-on: ubuntu-latest
    name: "Flake Check"
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Test deployment helpers
        run: |
          for test in .github/scripts/test-*.py; do
            python3 "$test"
          done
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ secrets.CACHIX_CACHE }}
      - name: Run nix flake check
        run: nix flake check --all-systems --show-trace
      - name: Discover configurations
        id: discover
        run: |
          matrix=$(nix-instantiate --eval --strict --json --impure \
            .github/scripts/discover.nix --argstr flakePath "$GITHUB_WORKSPACE")
          jq -e 'if length > 0 then . else error("No Nix configurations discovered") end' <<< "$matrix"
          echo "matrix=$(jq -c '{include: .}' <<< "$matrix")" >> "$GITHUB_OUTPUT"
  build:
    needs: flake-check
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.flake-check.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    name: "Build ${{ matrix.type }}/${{ matrix.name }}"
    steps:
      - uses: actions/checkout@v7
      - uses: $/.github/actions/free-up-space
      - name: Install Nix
        if: ${{ !endsWith(matrix.system, '-darwin') }}
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install single-user Nix for Darwin builds
        if: ${{ endsWith(matrix.system, '-darwin') }}
        uses: nixbuild/nix-quick-install-action@v35
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: cachix/cachix-action@v17
        with:
          name: ${{ secrets.CACHIX_CACHE }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true
      - name: Configure nixbuild.net for Darwin builds
        if: ${{ endsWith(matrix.system, '-darwin') }}
        uses: nixbuild/nixbuild-action@v26
        with:
          nixbuild_token: ${{ secrets.NIXBUILD_TOKEN }}
      - name: Build ${{ matrix.type }}/${{ matrix.name }}
        id: build
        # nixbuild-action sets max-jobs=0. Re-enable local Darwin builds;
        # cached Linux outputs should substitute before using remote builders.
        env:
          BUILD_ATTR: ${{ matrix.attr }}
          BUILD_SYSTEM: ${{ matrix.system }}
        run: |
          echo "Building $BUILD_ATTR on $BUILD_SYSTEM"
          store_path="$(nix build "$BUILD_ATTR" \
            --show-trace \
            --max-jobs auto \
            --option always-allow-substitutes true \
            --no-link \
            --print-out-paths)"

          if [[ -z "$store_path" || "$store_path" == *$'\n'* ]]; then
            echo "Expected exactly one build output, got: $store_path" >&2
            exit 1
          fi

          echo "store_path=$store_path" >> "$GITHUB_OUTPUT"
      - name: Push to Cachix
        env:
          CACHIX_CACHE: ${{ secrets.CACHIX_CACHE }}
          STORE_PATH: ${{ steps.build.outputs.store_path }}
        run: cachix push "$CACHIX_CACHE" "$STORE_PATH"
      - name: Retain deployment binaries
        if: ${{ github.event_name == 'push' && matrix.deploy }}
        env:
          CACHIX_CACHE: ${{ secrets.CACHIX_CACHE }}
          HOST: ${{ matrix.name }}
          STORE_PATH: ${{ steps.build.outputs.store_path }}
        run: cachix pin "$CACHIX_CACHE" "deploy-$HOST" "$STORE_PATH" --keep-days 90
      - name: Create deployment fragment
        if: ${{ github.event_name == 'push' && matrix.deploy }}
        env:
          AGENT: ${{ matrix.agent }}
          HOST: ${{ matrix.name }}
          FRAGMENT_PATH: deploy-${{ matrix.name }}.json
          STORE_PATH: ${{ steps.build.outputs.store_path }}
        run: |
          jq -n \
            --arg agent "$AGENT" \
            --arg host "$HOST" \
            --arg storePath "$STORE_PATH" \
            '{host: $host, agent: $agent, storePath: $storePath}' \
            > "$FRAGMENT_PATH"
      - name: Upload deployment fragment
        if: ${{ github.event_name == 'push' && matrix.deploy }}
        uses: actions/upload-artifact@v7
        with:
          name: deploy-${{ matrix.name }}
          path: deploy-${{ matrix.name }}.json
          overwrite: true
          if-no-files-found: error
          retention-days: 45
  publish-release:
    needs: [flake-check, build]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    name: "Publish release manifest"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: deploy-*
          path: deploy-fragments
          merge-multiple: true
      - name: Assemble release manifest
        env:
          BUILD_MATRIX: ${{ needs.flake-check.outputs.matrix }}
        run: |
          jq -s --arg commit "$GITHUB_SHA" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            --argjson matrix "$BUILD_MATRIX" \
            -f .github/scripts/assemble-release.jq deploy-fragments/*.json > release.json
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error
          retention-days: 45
  notify-update-ready:
    needs: build
    if: >-
      ${{


        github.event_name == 'pull_request' &&
        github.event.pull_request.head.ref == 'update-flake-lock'
      }}
    runs-on: ubuntu-latest
    name: "Notify Update Ready"
    steps:
      - uses: $/.github/actions/ntfy
        with:
          topic: ${{ secrets.NTFY_TOPIC }}
          title: "[GitHub] Flake Update Ready"
          priority: "3"
          tags: "white_check_mark"
          message: |
            Merge to build a release. Deployment requires separate approval.
            Repo: ${{ github.repository }}
            Commit: ${{ github.event.pull_request.head.sha }}
          button_url: ${{ github.event.pull_request.html_url }}
  notify:
    needs: [flake-check, build, publish-release]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    name: "Notify CI Failures"
    steps:
      - uses: $/.github/actions/ntfy
        with:
          topic: ${{ secrets.NTFY_TOPIC }}
          title: "[GitHub] CI Failed"
          priority: "5"
          tags: "x"
          message: |
            A CI build or release manifest failed. No deployment was prepared.
            Repo: ${{ github.repository }}
            Commit: ${{ github.sha }}
